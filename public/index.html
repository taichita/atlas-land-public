<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Atlas Land</title>
    <link rel="icon" href="/assets/gpt-atlas.ico" />
    <link rel="stylesheet" href="/fonts.css" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/vendor/papaparse.js" defer></script>
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <header class="appbar">
      <button id="sidebar-toggle" class="icon" aria-label="案件一覧の表示切替">
        ☰
      </button>
      <div class="brand">
        <img class="brand-icon" src="/assets/gpt-atlas.png" alt="" />
        <span>Atlas Land</span>
      </div>
      <nav class="mode-switch">
        <button id="work-mode" aria-pressed="true">作業</button
        ><button id="globe-mode" aria-pressed="false">
          俯瞰 <span>◉</span>
        </button>
      </nav>
      <button id="usage-button" title="AIの利用量">利用量</button
      ><button id="palette-button" title="外観・テーマ" aria-label="外観・テーマ">◉</button
      ><span id="connection" class="connection">接続を準備中</span
      ><details id="app-menu" class="app-menu">
        <summary aria-label="アプリのメニュー">メニュー</summary>
        <div class="app-menu-popover">
          <button id="new-window">新しいウィンドウ <kbd>Ctrl+N</kbd></button>
          <button id="dual-monitor">2画面に配置</button>
          <button id="menu-appearance">外観・テーマ</button>
          <button id="note-folder">メモの作業フォルダ</button>
          <button id="menu-bookmarks">ブックマーク</button>
          <button id="menu-shortcuts">
            <span>キーボード ショートカット</span><kbd id="menu-shortcut-key">F1</kbd>
          </button>
          <button id="settings-button">設定と接続</button>
        </div>
      </details>
    </header>
    <div class="shell">
      <aside id="sidebar">
        <div class="side-heading">
          <span>案件</span><span id="unread-count" class="pink"></span>
        </div>
        <div class="side-actions">
          <button id="new-task" class="primary">＋ 新しい案件</button
          ><button id="import-task" title="Codexの案件を開く">開く</button>
        </div>
        <input
          id="task-search"
          placeholder="案件・フォルダを検索"
          aria-label="案件・フォルダを検索"
        />
        <div class="filter-row">
          <button data-filter="working">作業中</button
          ><button data-filter="attention" aria-pressed="true">あなたの番</button
          ><button data-filter="stored">保管</button>
        </div>
        <div class="list-options"><select id="task-grouping" aria-label="案件の並べ方"><option value="time">新しい返答順</option><option value="folder">フォルダ別</option></select><button id="sync-tasks" title="案件を同期" aria-label="案件を同期">↻</button></div>
        <div id="task-list"></div>
        <div class="side-footer">
          <span id="task-count"></span>
        </div>
      </aside>
      <main>
        <section id="work-view">
          <div class="pane-toolbar"><button id="pane-split">＋ ペイン</button><select id="pane-layout" aria-label="ペインの配置"><option value="auto">格子状</option><option value="columns">横並び</option><option value="rows">縦並び</option></select><button id="pane-move" title="選択中のタブを次のペインへ移動">タブを隣へ</button><button id="pane-swap" hidden>ペインを入れ替え</button><button id="pane-close" disabled>ペインを閉じる</button></div>
          <div id="workspace-deck"><div id="primary-slot">
          <nav id="pane-tabbar" class="pane-tabbar" aria-label="このペインのタブ" data-expanded="false">
            <button id="tab-rail-toggle" aria-label="タブ一覧を開く" aria-expanded="false" aria-controls="work-tabs">▥<span class="rail-label">タブ <small id="tab-count"></small></span></button>
            <button id="rail-bookmarks" title="ブックマーク（Ctrl+Shift+O）" aria-label="ブックマークを開く">★<span class="rail-label">ブックマーク</span></button>
            <input id="tab-search" type="search" placeholder="タブを検索" aria-label="タブを検索" />
            <div id="work-tabs" class="work-tabs"></div><div class="tab-actions"><button id="new-note" aria-label="＋ メモ" title="新しいメモ（Ctrl+Alt+N）"><span>＋</span><span class="rail-label">メモ</span></button><button id="open-web-home" aria-label="＋ Web" title="このペインに新しいWebタブを開く"><span>◎</span><span class="rail-label">Web</span></button><button id="open-files-home" aria-label="＋ ファイル" title="このペインでファイルを開く"><span>▱</span><span class="rail-label">ファイル</span></button></div>
          </nav>
          <div class="pane-content">
          <div id="browser-view" hidden>
            <div id="browser-tabs" hidden></div>
            <form id="address-form" class="addressbar">
              <button type="button" id="browser-back" aria-label="戻る">
                ←</button
              ><button type="button" id="browser-forward" aria-label="進む">
                →</button
              ><button type="button" id="browser-reload" aria-label="再読込">
                ↻</button
              ><input
                id="address"
                placeholder="URL または検索ワード"
                aria-label="Webアドレス"
              /><button type="submit">開く</button><button type="button" id="bookmark-page" aria-label="このページをブックマーク" title="ブックマーク（Ctrl+D）">☆</button><button type="button" id="show-bookmarks">ブックマーク</button>
            </form>
            <div class="browser-tools">
              <button id="translate-page" title="Codexでページの文章を日本語に翻訳">日本語訳</button><button id="translate-original" hidden>原文</button><label title="このサイトを開いたときにCodexで翻訳"><input id="translate-auto" type="checkbox">自動翻訳</label>
              <button id="share-page">このページをAIへ添付</button
              ><button id="suspend-tabs">他のタブを休止</button
              ><label
                >動画速度
                <select id="video-speed" aria-label="動画再生速度">
                  <option>1</option>
                  <option>1.25</option>
                  <option>1.5</option>
                  <option>2</option>
                  <option>2.5</option>
                  <option>3</option>
                  <option>4</option>
                </select>
                倍</label
              ><span id="browser-message" class="small muted"></span
              ><button type="button" id="browser-split" aria-pressed="false" title="Webを2ペインで表示">▥ 分割</button
              ><select id="browser-secondary" aria-label="分割するWebタブ" hidden></select>
            </div>
            <div id="browser-slot">
              <div class="browser-empty">
                <div class="quick-sites">
                  <button data-url="https://www.google.com/">Google</button
                  ><button data-url="https://www.youtube.com/">YouTube</button
                  ><button data-url="https://mail.google.com/">Gmail</button
                  ><button data-url="https://docs.google.com/">Docs</button
                  ><button data-url="https://github.com/">GitHub</button>
                </div>
              </div>
            </div>
          </div>
          <div class="taskbar">
            <div>
              <h1>
                <button id="task-title" title="案件名を変更">Atlas Land</button>
              </h1>
              <button id="task-folder" class="muted" title="作業フォルダを変更">
                C:\dev
              </button>
            </div>
            <div class="task-actions">
              <span id="task-status" class="badge"></span
              ><button id="open-codex" hidden>Codexで開く</button
              ><button id="store-task" hidden>保管する</button
              ><button id="inspect-task" hidden>関係 ↗</button>
              <div class="layout-switch">
                <button data-layout="split" aria-pressed="true">並べる</button
                ><button data-layout="artifact">ファイル</button
                ><button data-layout="conversation">会話</button>
              </div>
            </div>
          </div>
          <div id="panes" class="panes" data-layout="split">
            <section id="conversation-pane" class="conversation-pane">
              <div id="conversation" class="conversation">
                <div class="welcome">
                  <img
                    class="welcome-icon"
                    src="/assets/gpt-atlas.png"
                    alt=""
                  />
                  <h2>Atlas Land</h2>
                  <button id="welcome-new" class="primary">新しい案件</button>
                </div>
              </div>
              <div id="request-area"></div>
              <div id="plan-area"></div>
              <form id="composer" class="composer is-collapsed">
                <button type="button" id="composer-toggle" aria-expanded="false" aria-controls="composer-fields">指示を入力</button>
                <button type="button" id="interrupt" hidden>中断</button>
                <div id="composer-fields" hidden>
                <div id="attachments" class="attachments"></div>
                <textarea
                  id="prompt"
                  rows="3"
                  placeholder="指示を入力…"
                  aria-label="AIへの指示"
                ></textarea>
                <div class="composer-bar">
                  <button type="button" id="attach-image" title="画像を添付（Ctrl＋Vでも貼り付け）">＋ 画像</button>
                  <input type="file" id="image-picker" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
                  <select id="model" aria-label="モデル"></select
                  ><select id="effort" aria-label="思考の深さ"></select
                  ><span class="spacer"></span
                  ><button type="submit" id="send" class="primary">
                    送信 ↗
                  </button>
                </div>
                <div id="composer-note" class="small muted">
                  Ctrl + Enter で送信
                </div>
                </div>
              </form>
            </section>
            <div
              id="splitter"
              class="splitter"
              role="separator"
              aria-label="ペイン幅を調整"
              tabindex="0"
            ></div>
            <section id="artifact-pane" class="artifact-pane">
              <div class="artifact-nav">
                <div class="segmented">
                  <button id="files-mode" class="file-action" aria-pressed="true">◈ ファイル</button
                  ><button id="browser-mode" class="web-action">◎ Web</button>
                </div>
                <span class="spacer"></span
                ><button id="artifact-close" hidden>閉じる</button>
              </div>
              <div id="files-view" class="files-view">
                <div class="file-toolbar">
                  <button id="file-up" aria-label="上のフォルダ">↑</button
                  ><span id="file-breadcrumb" class="muted"
                    >成果物とファイル</span
                  ><span class="spacer"></span><button id="open-local-file">ローカルを開く</button
                  ><button id="file-refresh">更新</button>
                </div>
                <div id="file-list" class="file-list">
                  <div class="empty">ファイル</div>
                </div>
                <div id="editor" hidden>
                  <div class="editor-heading">
                    <strong id="editor-name"></strong
                    ><span class="spacer"></span
                    ><button id="reveal-file">保存場所</button
                    ><button id="read-mode" aria-pressed="true">読む</button
                    ><button id="edit-mode">編集</button
                    ><button id="source-mode">元データ</button
                    ><button id="save-file" class="primary">保存</button>
                  </div>
                  <div id="editor-meta" class="small muted"></div>
                  <div id="editor-content" class="editor-content"></div>
                  <div id="edit-summary" class="small"></div>
                </div>
              </div>
            </section>
          </div>
          </div></div><div id="workspace-divider" role="separator" tabindex="0" aria-label="左右のペイン幅" hidden></div><div id="secondary-slot" hidden></div></div>
        </section>
        <section id="globe-view" hidden>
          <div class="globe-top">
            <div>
              <h1>Atlas</h1>
            </div>
            <div class="globe-controls">
              <button id="graph-reset">視点を戻す</button
              ><button id="graph-labels" aria-pressed="true">名前</button
              ><button id="graph-list">一覧で見る</button>
            </div>
          </div>
          <div class="graph-stats" id="graph-stats"></div>
          <div class="globe-body">
            <div id="graph-stage">
              <canvas
                id="graph-canvas"
                aria-label="案件の3Dネットワーク。ドラッグで回転、ホイールで拡大縮小。右の一覧からキーボードでも選択できます。"
              ></canvas>
              <div id="graph-label-layer"></div>
              <div id="graph-empty" class="empty" hidden>案件がありません</div>
              <div class="graph-legend">
                <span><i class="dot completed"></i>あなたの番</span
                ><span><i class="dot running"></i>実行中</span
                ><span><i class="dot waiting"></i>確認待ち</span
                ><span><i class="dot failed"></i>エラー</span
                ><span>実線 → 依存・引継ぎ</span
                ><span>細線 — フォルダ・成果物</span>
              </div>
              <span class="graph-hint">ドラッグで回転 · ホイールで拡大</span>
            </div>
            <aside id="graph-inspector">
              <div id="graph-node-list"></div>
            </aside>
          </div>
        </section>
      </main>
    </div>
    <dialog id="dialog"><div id="dialog-body"></div></dialog>
    <div id="toast" role="status" hidden></div>
  </body>
</html>
